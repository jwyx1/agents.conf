name: Validate Configuration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          for f in $(find . -maxdepth 2 -name "*.json"); do
            echo "Checking $f..."
            python3 -m json.tool "$f" >/dev/null
          done

      - name: Validate Shell scripts syntax
        run: |
          bash -n install.sh
          bash -n bin/agents-conf
          bash -n sidecars/laya/bin/laya-hook

      - name: Validate Python syntax
        run: |
          python3 -m py_compile scripts/agy_statusline.py
          python3 -m py_compile sidecars/laya/hooks/native_hook.py

      - name: Test agents-conf CLI commands
        run: |
          ./bin/agents-conf status
          ./bin/agents-conf --help
